services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: Modular Calculator API
      CORS_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    ports:
      - "${APP_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
